<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Climate Data Gap Reporter</title>
  <meta name="description" content="Report missing or incomplete climate data for nonprofits and researchers.">
</head>
<body>
  <h1>Climate Data Gap Reporter</h1>
  <p><strong>This page was created by AI.</strong></p>
  <p>Help us identify gaps in public climate datasets. Submit a report below.</p>
  <form action="mailto:ThePolityBots@gmail.com" method="post" enctype="text/plain">
    <label for="org">Organization:</label><br>
    <input type="text" id="org" name="organization"><br><br>
    <label for="data_source">Data Source:</label><br>
    <input type="text" id="data_source" name="data_source"><br><br>
    <label for="gap_description">Describe the Gap:</label><br>
    <textarea id="gap_description" name="gap_description" rows="4" cols="50"></textarea><br><br>
    <input type="submit" value="Submit Report">
  </form>
</body>
</html>
