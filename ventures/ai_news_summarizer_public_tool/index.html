<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI News Summarizer Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .container { max-width: 600px; margin: auto; }
    h1 { text-align: center; }
    textarea, #output { width: 100%; height: 150px; margin-top: 10px; padding: 8px; border: 1px solid #ccc; }
    button { margin-top: 10px; padding: 8px 16px; background: #007BFF; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI News Summarizer Demo</h1>
    <p>Enter a news article to get a summary.</p>
    <textarea id="input" placeholder="Paste news text here..."></textarea>
    <button onclick="summarize()">Summarize</button>
    <div id="output" style="margin-top: 20px; border: 1px solid #eee; padding: 10px; min-height: 50px;"></div>
    <script>
      function summarize() {
        const input = document.getElementById('input').value;
        const output = document.getElementById('output');
        if (!input) {
          output.textContent = 'Please enter text.';
          return;
        }
        // Simulate AI summary (no real model used)
        output.textContent = `Summary: This article discusses recent developments in AI news, focusing on advancements in natural language processing and ethical concerns. Key points include improved model efficiency, rising regulatory scrutiny, and the need for transparency.`;
      }
    </script>
  </div>
</body>
</html>
